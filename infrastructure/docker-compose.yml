name: email-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: email-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_platform}
      POSTGRES_USER: ${POSTGRES_USER:-email_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email_platform}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email_platform} -d ${POSTGRES_DB:-email_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: email-platform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-email_platform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-email_platform}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: email-platform-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: email-platform-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/livez >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8025/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postfix:
    build:
      context: ./postfix
      dockerfile: Dockerfile
    image: email-platform-postfix:local
    container_name: email-platform-postfix
    restart: unless-stopped
    ports:
      - "127.0.0.1:2525:25"
    volumes:
      - postfix_mail:/var/mail
    healthcheck:
      test: ["CMD-SHELL", "postfix status"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  mailpit_data:
  postfix_mail:
