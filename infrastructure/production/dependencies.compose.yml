name: texto-email-production

# Fresh, dedicated production services. Do not attach old RabbitMQ volumes to a new major version.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?required}
      POSTGRES_USER: ${DATABASE_USERNAME:?required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?required}
    ports: ["127.0.0.1:15433:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 15
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: texto-email-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
    ports: ["127.0.0.1:15673:5672", "127.0.0.1:15674:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  postgres:
  rabbitmq:
  redis:
