spring:
  application:
    name: email-platform
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/email_platform}
    username: ${DATABASE_USERNAME:email_platform}
    password: ${DATABASE_PASSWORD:email_platform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:email_platform}
    password: ${RABBITMQ_PASSWORD:email_platform}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: always
  health:
    db:
      enabled: true
    rabbit:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: false

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: 0.1.0

email-platform:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    api-docs-public: ${API_DOCS_PUBLIC:false}
  mailpit:
    host: ${MAILPIT_HOST:localhost}
    smtp-port: ${MAILPIT_SMTP_PORT:1025}
  domains:
    allow-platform-test-senders: ${ALLOW_PLATFORM_TEST_SENDERS:true}
  dkim:
    encryption-key: ${DKIM_KEY_ENCRYPTION_KEY:}
  email:
    max-recipients: ${EMAIL_MAX_RECIPIENTS:50}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:5}
    outbox-poll-ms: ${EMAIL_OUTBOX_POLL_MS:500}
    rate-limit-per-minute: ${EMAIL_RATE_LIMIT_PER_MINUTE:120}
  webhooks:
    allow-http: ${WEBHOOKS_ALLOW_HTTP:false}
    max-attempts: ${WEBHOOKS_MAX_ATTEMPTS:5}
    connect-timeout-ms: ${WEBHOOKS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${WEBHOOKS_READ_TIMEOUT_MS:5000}
    encryption-key: ${WEBHOOKS_ENCRYPTION_KEY:}
  billing:
    provider: ${BILLING_PROVIDER:noop}
    grace-period-days: ${BILLING_GRACE_PERIOD_DAYS:3}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
