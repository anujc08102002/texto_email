spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoint:
    health:
      show-details: never
      show-components: when-authorized

email-platform:
  security:
    api-docs-public: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mailpit:
    host: ${MAILPIT_HOST}
    smtp-port: ${MAILPIT_SMTP_PORT}
  mta:
    implementation: ${MTA_IMPLEMENTATION:mailpit}
    require-dkim: ${MTA_REQUIRE_DKIM:true}
    ehlo-host: ${MTA_EHLO_HOST:texto.local}
    smtp:
      host: ${MTA_SMTP_HOST:}
      port: ${MTA_SMTP_PORT:0}
      connection-timeout-ms: ${MTA_SMTP_CONNECTION_TIMEOUT_MS:5000}
      read-timeout-ms: ${MTA_SMTP_READ_TIMEOUT_MS:5000}
      write-timeout-ms: ${MTA_SMTP_WRITE_TIMEOUT_MS:5000}
      username: ${MTA_SMTP_USERNAME:}
      password: ${MTA_SMTP_PASSWORD:}
    starttls:
      enabled: ${MTA_STARTTLS_ENABLED:false}
      required: ${MTA_STARTTLS_REQUIRED:false}
    ssl:
      enabled: ${MTA_SSL_ENABLED:false}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: prod
