spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoint:
    health:
      show-details: never
      show-components: when-authorized

email-platform:
  ses-feedback:
    enabled: ${SES_FEEDBACK_ENABLED:false}
    queue-url: ${SES_FEEDBACK_QUEUE_URL:}
    max-messages: ${SES_FEEDBACK_MAX_MESSAGES:10}
    wait-seconds: ${SES_FEEDBACK_WAIT_SECONDS:20}
    visibility-timeout-seconds: ${SES_FEEDBACK_VISIBILITY_TIMEOUT_SECONDS:120}
    poll-ms: ${SES_FEEDBACK_POLL_MS:1000}
  security:
    api-docs-public: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mta:
    implementation: ${MTA_IMPLEMENTATION}
    public-delivery-enabled: ${EMAIL_PUBLIC_DELIVERY_ENABLED:false}
    hostname: ${MTA_HOSTNAME:}
    outbound-ip: ${MTA_OUTBOUND_IP:}  
    smtp:
      host: ${MTA_SMTP_HOST:}
      port: ${MTA_SMTP_PORT:587}
      connection-timeout-ms: ${MTA_SMTP_CONNECTION_TIMEOUT_MS:10000}
      read-timeout-ms: ${MTA_SMTP_READ_TIMEOUT_MS:30000}
      write-timeout-ms: ${MTA_SMTP_WRITE_TIMEOUT_MS:30000}
      ehlo-hostname: ${MTA_SMTP_EHLO_HOSTNAME:${MTA_HOSTNAME}}
      starttls:
        enabled: ${MTA_SMTP_STARTTLS_ENABLED:true}
        required: ${MTA_SMTP_STARTTLS_REQUIRED:true}
      ssl:
        enabled: ${MTA_SMTP_SSL_ENABLED:false}
  ses:
    enabled: ${SES_ENABLED:false}
    region: ${SES_REGION:ap-south-1}
    configuration-set-name: ${SES_CONFIGURATION_SET_NAME:}
  email:
    max-rfc822-bytes: ${EMAIL_MAX_RFC822_BYTES:10485760}
    rate-limit-per-minute: ${EMAIL_RATE_LIMIT_PER_MINUTE:830}
  bounce:
    domain: ${BOUNCE_DOMAIN}
    mx-hostname: ${BOUNCE_MX_HOSTNAME:}
  domains:
    allow-platform-test-senders: ${ALLOW_PLATFORM_TEST_SENDERS:false}
    dkim-key-encryption-key: ${DKIM_KEY_ENCRYPTION_KEY}
    spf-authorize-outbound-ip: ${SPF_AUTHORIZE_OUTBOUND_IP:false}
    spf-include-provisioned: ${SPF_INCLUDE_PROVISIONED:false}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: prod
